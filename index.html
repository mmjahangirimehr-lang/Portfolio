<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمدمهدی جهانگیری مهر | طراح گرافیک و موشن گرافیک</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Font definition for Modam and fallback Vazirmatn -->
    <style>
        @font-face {
            font-family: 'Modam';
            src: url('./Modam.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Modam';
            src: url('./Modam-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Modam';
            src: url('./Modam-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Inter:wght@400;600;700&display=swap');

        /* اعمال فونت مدام روی تمام المان‌ها */
        * {
            font-family: 'Modam', 'Vazirmatn', sans-serif;
        }
        
        .en-font, .en-font * {
            font-family: 'Inter', sans-serif !important;
        }

        button {
            font-family: inherit !important;
        }

        html, body {
            background-color: #121212;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            overflow-y: scroll !important; /* همیشه نوار اسکرول عمودی را نشان بده */
            scrollbar-gutter: stable; /* جلوگیری از پرش صفحه هنگام تغییر تب */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #2e2e2e;
            border-radius: 10px;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen selection:bg-[#FF6B00] selection:text-black">

    <div id="root"></div>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Mail, Phone, MapPin, Calendar, Download, ChevronRight, CheckCircle, ExternalLink, ChevronLeft, Globe, Play, Send, X } = lucide;

        function Portfolio() {
            const [activeTab, setActiveTab] = useState('about');
            const [activeFilter, setActiveFilter] = useState('all');
            const [showContact, setShowContact] = useState(false);
            const [boxHeight, setBoxHeight] = useState('auto');
            const [language, setLanguage] = useState('fa'); // 'fa' or 'en'
            const [selectedProject, setSelectedProject] = useState(null);
            
            const contentRef = useRef(null);
            const navScrollRef = useRef(null);

            const content = {
                fa: {
                    profile: {
                        name: "محمدمهدی جهانگیری مهر",
                        title: "طراح گرافیک و موشن گرافیک"
                    },
                    ui: {
                        contact: "ارتباط با من",
                        phoneText: "۰۹۱۲ ۷۳ ۷۳ ۱۵۸",
                        telegramText: "@Mahdi_Jahangirimehr",
                        telegramUrl: "https://t.me/Mahdi_Jahangirimehr",
                    },
                    tabs: {
                        about: "درباره من",
                        experience: "سوابق کاری",
                        portfolio: "نمونه‌کارها",
                        education: "آموزش‌ها و دوره‌ها",
                        skills: "مهارت‌ها"
                    },
                    filters: {
                        all: "همه",
                        graphic: "طراحی گرافیک",
                        motion: "موشن گرافیک",
                        logo: "طراحی لوگو"
                    }
                },
                en: {
                    profile: {
                        name: "mm.jahangirimehr",
                        title: "Graphic & Motion Designer"
                    },
                    ui: {
                        contact: "Contact Me",
                        phoneText: "+98 912 73 73 158",
                        telegramText: "@Mahdi_Jahangirimehr",
                        telegramUrl: "https://t.me/Mahdi_Jahangirimehr",
                    },
                    tabs: {
                        about: "About Me",
                        experience: "Experience",
                        portfolio: "Portfolio",
                        education: "Education & Courses",
                        skills: "Skills"
                    },
                    filters: {
                        all: "All",
                        graphic: "Graphic Design",
                        motion: "Motion Design",
                        logo: "Logo Design"
                    }
                }
            };

            const currentContent = content[language];
            const currentUI = currentContent.ui;
            const currentTabs = currentContent.tabs;
            const currentFilters = currentContent.filters;

            const titleWidths = {
                fa: {
                    about: '110px',
                    experience: '120px',
                    portfolio: '110px',
                    'portfolio-all': '110px',
                    'portfolio-graphic': '200px',
                    'portfolio-motion': '190px',
                    'portfolio-logo': '190px',
                    education: '160px',
                    skills: '100px'
                },
                en: {
                    about: '115px',
                    experience: '115px',
                    portfolio: '100px',
                    'portfolio-all': '100px',
                    'portfolio-graphic': '170px',
                    'portfolio-motion': '160px',
                    'portfolio-logo': '150px',
                    education: '160px',
                    skills: '80px'
                }
            };

            let currentTitleKey = activeTab;
            let displayTitle = currentTabs[activeTab];
            if (activeTab === 'portfolio') {
                currentTitleKey = `portfolio-${activeFilter}`;
                if (activeFilter !== 'all') {
                    displayTitle = `${currentTabs.portfolio} / ${currentFilters[activeFilter]}`;
                }
            }

            // تابع اسکرول خودکار منوی موبایل
            const scrollToTabButton = (e) => {
                const container = navScrollRef.current;
                if (!container) return;
                const button = e.currentTarget;
                const containerRect = container.getBoundingClientRect();
                const btnRect = button.getBoundingClientRect();
                const scrollLeft = container.scrollLeft + (btnRect.left - containerRect.left) - (containerRect.width / 2) + (btnRect.width / 2);
                container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            };

            useEffect(() => {
                const el = contentRef.current;
                if (!el) return;

                const observer = new ResizeObserver(() => {
                    setBoxHeight(`${el.offsetHeight}px`);
                });

                observer.observe(el);
                setBoxHeight(`${el.offsetHeight}px`);

                return () => observer.disconnect();
            }, [activeTab, activeFilter, language]);

            const portfolioItems = [
                { 
                    id: 1, 
                    category: 'motion', 
                    type: 'video', 
                    thumbnail: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=600",
                    videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                    title: { fa: "تیزر تبلیغاتی محصول", en: "Product Promo Teaser" },
                    desc: { fa: "طراحی و موشن‌گرافیک تیزر معرفی محصول برای برند تجاری.", en: "Product introduction teaser design and motion graphics for commercial brand." }
                },
                { 
                    id: 2, 
                    category: 'graphic', 
                    type: 'image', 
                    thumbnail: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600",
                    title: { fa: "پوستر همایش سراسری", en: "National Event Poster" },
                    desc: { fa: "طراحی کادربندی، هویت بصری و پوستر رسمی همایش سالانه.", en: "Layout design, visual identity and official poster for the annual conference." }
                },
                { 
                    id: 3, 
                    category: 'logo', 
                    type: 'image', 
                    thumbnail: "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&q=80&w=600",
                    title: { fa: "برندینگ و لوگوی استارتاپ", en: "Startup Branding & Logo" },
                    desc: { fa: "طراحی نشان تجاری مینیمال و راهنمای هویت بصری.", en: "Minimalist brand mark design and visual identity guidelines." }
                },
                { 
                    id: 4, 
                    category: 'motion', 
                    type: 'video', 
                    thumbnail: "https://images.unsplash.com/photo-1526498460520-4c246339dccb?auto=format&fit=crop&q=80&w=600",
                    videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                    title: { fa: "موشن گرافیک اینمیشن کوتاه", en: "Short Animation Motion" },
                    desc: { fa: "استوری‌برد و انیمیت دوبعدی برای کمپین شبکه‌های اجتماعی.", en: "Storyboard and 2D animation for social media campaign." }
                },
            ];

            const experienceItems = [
                { id: 1, role: { fa: "موشن‌دیزاینر ارشد", en: "Senior Motion Designer" }, company: { fa: "آژانس تبلیغاتی رسا", en: "Rasa Advertising Agency" }, duration: { fa: "۱۴۰۱ - تاکنون", en: "2022 - Present" }, desc: { fa: "سرپرست تیم موشن گرافیک و طراحی تیزرهای تلویزیونی و دیجیتال.", en: "Head of motion graphics team and designer of TV and digital teasers." } },
                { id: 2, role: { fa: "طراح گرافیک", en: "Graphic Designer" }, company: { fa: "استودیو هنری بوم", en: "Boom Art Studio" }, duration: { fa: "۱۳۹۹ - ۱۴۰۱", en: "2020 - 2022" }, desc: { fa: "طراحی کمپین‌های تبلیغاتی، هویت بصری برندها و پوسترهای تخصصی.", en: "Designing advertising campaigns, brand visual identities, and specialized posters." } },
            ];

            const filteredPortfolio = activeFilter === 'all' 
                ? portfolioItems 
                : portfolioItems.filter(item => item.category === activeFilter);

            return (
                <div className={`min-h-screen bg-[#121212] flex justify-center selection:bg-[#FF6B00] selection:text-black transition-colors duration-500 ${language === 'en' ? 'en-font' : ''}`} dir={language === 'fa' ? 'rtl' : 'ltr'}>
                    <div className="w-full max-w-6xl p-4 sm:p-6 md:p-8 flex flex-col lg:flex-row gap-6 md:gap-8 lg:gap-10 relative items-start">
                        
                        {/* سایدبار سمت راست (در دسکتاپ) / بالای صفحه (در موبایل) */}
                        <aside className="w-full lg:w-[280px] shrink-0 bg-[#1e1e1e] rounded-3xl flex flex-col lg:sticky top-4 sm:top-6 lg:top-8 shadow-[0_8px_30px_rgb(0,0,0,0.3)] border border-gray-800/60 lg:h-[calc(100vh-4rem)] z-40 overflow-hidden">
                            
                            <div className="p-4 sm:p-6 shrink-0 flex flex-col gap-6 relative z-20">
                                <div className="flex justify-between items-center w-full">
                                    <div className="flex gap-1 bg-[#121212] p-1 rounded-xl border border-gray-800">
                                        <button 
                                            onClick={() => setLanguage('fa')}
                                            className={`px-3 py-1 text-xs font-bold rounded-lg transition-colors ${language === 'fa' ? 'bg-[#FF6B00] text-[#121212]' : 'text-gray-400 hover:bg-gray-800'}`}
                                        >
                                            فارسی
                                        </button>
                                        <button 
                                            onClick={() => setLanguage('en')}
                                            className={`px-3 py-1 text-xs font-bold rounded-lg transition-colors ${language === 'en' ? 'bg-[#FF6B00] text-[#121212]' : 'text-gray-400 hover:bg-gray-800'}`}
                                        >
                                            English
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto px-4 sm:px-6 pb-6 scrollbar-hide relative z-10 flex flex-col gap-6">
                                
                                <div className="flex items-center gap-3 bg-[#121212] p-3 rounded-2xl border border-gray-800/80">
                                    <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-[#FF6B00] to-amber-600 flex items-center justify-center text-[#121212] font-black text-lg shrink-0 shadow-md">
                                        م.ج
                                    </div>
                                    <div className="flex flex-col min-w-0">
                                        <h1 className="text-white font-black text-sm truncate">{currentContent.profile.name}</h1>
                                        <p className="text-gray-400 text-[11px] truncate mt-0.5">{currentContent.profile.title}</p>
                                    </div>
                                </div>

                                {/* منوی ناوبری با قابلیت اسکرول خودکار در موبایل */}
                                <nav 
                                    ref={navScrollRef}
                                    className="flex lg:flex-col flex-row gap-2 lg:gap-0 overflow-x-auto lg:overflow-visible scrollbar-hide py-1"
                                >
                                    {Object.keys(currentTabs).map((key, index) => (
                                        <React.Fragment key={key}>
                                            <button
                                                onClick={(e) => {
                                                    setActiveTab(key);
                                                    if (key !== 'portfolio') setActiveFilter('all');
                                                    scrollToTabButton(e);
                                                }}
                                                className={`
                                                    relative group px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 shrink-0 lg:shrink
                                                    ${activeTab === key ? 'text-[#FF6B00] bg-[#121212] shadow-sm border border-gray-800' : 'text-gray-400 hover:text-white hover:bg-[#121212]/50'}
                                                    ${language === 'en' ? 'text-left' : 'text-right'}
                                                `}
                                            >
                                                <span className="relative z-10 whitespace-nowrap">{currentTabs[key]}</span>
                                            </button>

                                            {key === 'portfolio' && (
                                                <div className={`
                                                    overflow-hidden transition-all duration-500 ease-in-out px-2
                                                    ${activeTab === 'portfolio' ? 'max-h-60 opacity-100 my-2' : 'max-h-0 opacity-0 my-0'}
                                                `}>
                                                    <div className={`flex flex-col gap-1 ${language === 'fa' ? 'border-r-2 border-gray-800 mr-2 pr-2' : 'border-l-2 border-gray-800 ml-2 pl-2'}`}>
                                                        {Object.keys(currentFilters).map((filterKey) => (
                                                            <button
                                                                key={filterKey}
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    setActiveFilter(filterKey);
                                                                }}
                                                                className={`
                                                                    text-xs font-bold py-2 px-3 rounded-lg transition-all
                                                                    ${language === 'en' ? 'text-left' : 'text-right'}
                                                                    ${activeFilter === filterKey 
                                                                        ? 'text-[#FF6B00] bg-[#121212]' 
                                                                        : 'text-gray-500 hover:text-gray-300 hover:bg-[#121212]/50'}
                                                                `}
                                                            >
                                                                {currentFilters[filterKey]}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                            {index < Object.keys(currentTabs).length - 1 && (
                                                <div className="hidden lg:block w-full h-px bg-gray-800/60 my-1"></div>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </nav>
                            </div>

                            {/* بخش ارتباط با من در پایین سایدبار */}
                            <div className="relative shrink-0 pt-4 pb-6 px-4 sm:px-6 z-20 mt-auto bg-[#1e1e1e]">
                                <div className="absolute top-0 left-0 right-0 h-8 bg-gradient-to-t from-[#1e1e1e] to-transparent pointer-events-none -mt-8"></div>
                                <div className="flex flex-col relative w-full items-center">
                                    <button 
                                        onClick={() => setShowContact(!showContact)}
                                        className="group relative z-10 flex items-center justify-between w-full h-11 px-4 bg-[#2e2e2e] text-white text-[13px] font-bold rounded-xl hover:bg-[#383838] transition-all duration-300 shadow-sm border border-gray-700/50"
                                    >
                                        <span>{currentUI.contact}</span>
                                        <ChevronLeft className={`w-4 h-4 transition-transform duration-300 ${showContact ? '-rotate-90' : (language === 'fa' ? 'rotate-0' : 'rotate-180')}`} />
                                    </button>
                                    
                                    <div 
                                        className={`w-full overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                                            showContact ? 'max-h-32 opacity-100 mt-2' : 'max-h-0 opacity-0 mt-0'
                                        }`}
                                    >
                                        <div className="bg-[#121212] p-3 rounded-xl flex flex-col gap-2 border border-gray-800 shadow-inner w-full">
                                            <div className="flex items-center gap-3">
                                                <div className="w-6 h-6 rounded-md bg-[#1e1e1e] flex items-center justify-center text-[#FF6B00] shrink-0 border border-gray-800">
                                                    <Phone className="w-3.5 h-3.5" />
                                                </div>
                                                <a href="tel:+989127373158" className="text-gray-200 font-bold tracking-widest text-[12px] hover:text-[#FF6B00] transition-colors" dir="ltr">
                                                    {currentUI.phoneText}
                                                </a>
                                            </div>
                                            <div className="w-full h-px bg-gray-800/80"></div>
                                            <div className="flex items-center gap-3">
                                                <div className="w-6 h-6 rounded-md bg-[#1e1e1e] flex items-center justify-center text-[#0088cc] shrink-0 border border-gray-800">
                                                    <Send className="w-3.5 h-3.5" />
                                                </div>
                                                <a href={currentUI.telegramUrl} target="_blank" rel="noopener noreferrer" className="text-gray-200 font-bold tracking-wider text-[12px] hover:text-[#FF6B00] transition-colors" dir="ltr">
                                                    {currentUI.telegramText}
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* بخش اصلی محتوا */}
                        <main className="flex-1 w-full relative min-w-0 pb-12">
                            
                            <div className="sticky top-0 z-30 pt-0 bg-[#121212]">
                                <div className="pt-4 bg-[#121212]">
                                    <div 
                                        className={`h-11 bg-[#FF6B00] rounded-xl flex items-center px-4 overflow-hidden transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] ${language === 'fa' ? 'origin-right' : 'origin-left'}`}
                                        style={{ width: titleWidths[language][currentTitleKey] || '200px' }}
                                    >
                                        <h2 key={currentTitleKey} className="text-[#121212] font-black text-xs sm:text-sm whitespace-nowrap animate-in fade-in zoom-in-95 duration-500">
                                            {displayTitle}
                                        </h2>
                                    </div>
                                </div>
                                <div className="h-6 bg-gradient-to-b from-[#121212] to-transparent pointer-events-none"></div>
                            </div>

                            <div 
                                className="bg-[#1e1e1e] rounded-2xl w-full overflow-hidden transition-[height] duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] relative border border-gray-800/60 shadow-xl"
                                style={{ height: boxHeight }}
                            >
                                <div ref={contentRef} className="p-6 sm:p-8 absolute top-0 left-0 right-0 w-full">
                                    
                                    {activeTab === 'about' && (
                                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                                            <h3 className="text-xl font-black text-white mb-4">{currentTabs.about}</h3>
                                            <div className="prose prose-invert max-w-none text-gray-300 leading-relaxed text-sm sm:text-base">
                                                <p>
                                                    {language === 'fa' 
                                                        ? 'سلام! من محمدمهدی جهانگیری مهر هستم، طراح گرافیک و موشن‌دیزاینر. با سال‌ها تجربه در زمینه خلق هویت بصری، طراحی پوستر و موشن‌گرافیک، تلاش می‌کنم ایده‌ها را به آثار بصری زنده و تاثیرگذار تبدیل کنم.'
                                                        : 'Hello! I am mm.jahangirimehr, a graphic and motion designer. With years of experience in visual identity creation, poster design, and motion graphics, I strive to turn ideas into vivid and impactful visual artworks.'}
                                                </p>
                                                <p className="mt-4">
                                                    {language === 'fa' 
                                                        ? 'تخصص من در ترکیب اصول کلاسیک طراحی با پویاییِ موشن گرافیک است تا برندها و پروژه‌ها بالاترین میزان جذابیت و ارتباط را با مخاطب خود برقرار کنند.'
                                                        : 'My specialty is combining classic design principles with the dynamism of motion graphics so brands and projects can establish the highest level of engagement with their audience.'}
                                                </p>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'experience' && (
                                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                                            <div className="flex flex-col gap-8 relative before:content-[''] before:absolute before:top-2 before:bottom-2 before:w-px before:bg-gray-800 before:-mx-4 sm:before:-mx-6">
                                                {experienceItems.map((item) => (
                                                    <div key={item.id} className="relative z-10">
                                                        <div className={`absolute top-2 w-2 h-2 rounded-full bg-[#FF6B00] ring-4 ring-[#1e1e1e] -mx-[19.5px] sm:-mx-[27.5px] ${language === 'fa' ? 'right-0' : 'left-0'}`}></div>
                                                        <div className="flex flex-col sm:flex-row sm:items-baseline justify-between gap-1 sm:gap-4 mb-2">
                                                            <h4 className="text-white font-bold text-base">{item.role[language]}</h4>
                                                            <span className="text-gray-400 text-xs font-medium shrink-0 bg-[#121212] px-2.5 py-1 rounded-md border border-gray-800">{item.duration[language]}</span>
                                                        </div>
                                                        <h5 className="text-[#FF6B00] text-sm font-bold mb-3">{item.company[language]}</h5>
                                                        <p className="text-gray-400 text-sm leading-relaxed">{item.desc[language]}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'portfolio' && (
                                        <div key={`portfolio-${activeFilter}`} className="animate-in fade-in slide-in-from-bottom-4 duration-700 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                                            {filteredPortfolio.map((item) => (
                                                <div 
                                                    key={item.id} 
                                                    onClick={() => setSelectedProject(item)}
                                                    className="group relative rounded-xl sm:rounded-2xl overflow-hidden bg-[#121212] shadow-sm border border-gray-800 hover:border-gray-600 transition-all cursor-pointer flex flex-col"
                                                >
                                                    <div className="aspect-[4/3] w-full overflow-hidden relative bg-black">
                                                        <img src={item.thumbnail} alt={item.title[language]} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out opacity-90 group-hover:opacity-100" />
                                                        
                                                        {item.type === 'video' && (
                                                            <div className="absolute inset-0 flex items-center justify-center bg-black/40 group-hover:bg-black/20 transition-colors">
                                                                <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 group-hover:scale-110 transition-transform">
                                                                    <Play className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white ml-0.5" />
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="p-3 flex flex-col flex-1 justify-between">
                                                        <div>
                                                            <span className="text-[9px] sm:text-[10px] font-bold text-[#121212] bg-[#FF6B00] px-1.5 py-0.5 rounded-md mb-1 inline-block">
                                                                {currentFilters[item.category]}
                                                            </span>
                                                            <h4 className="text-white font-bold text-xs sm:text-sm group-hover:text-[#FF6B00] transition-colors leading-tight line-clamp-1">{item.title[language]}</h4>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {activeTab === 'education' && (
                                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                                            <div className="prose prose-invert max-w-none text-gray-300">
                                                <h4 className="text-white font-bold text-base mb-2">{language === 'fa' ? 'دوره‌های تخصصی و کارگاه‌ها' : 'Specialized Courses & Workshops'}</h4>
                                                <p>{language === 'fa' ? 'مدرک تخصصی موشن گرافیک و تدوین پیشرفته از موسسات معتبر آموزشی.' : 'Advanced motion graphics and editing professional certificate from reputable educational institutions.'}</p>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'skills' && (
                                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                {['After Effects', 'Premiere Pro', 'Photoshop', 'Illustrator', 'Cinema 4D', 'UI/UX Design'].map((skill, idx) => (
                                                    <div key={idx} className="bg-[#121212] border border-gray-800 p-3 rounded-xl flex items-center justify-between">
                                                        <span className="text-white font-bold text-xs sm:text-sm">{skill}</span>
                                                        <CheckCircle className="w-4 h-4 text-[#FF6B00]" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                </div>
                            </div>
                        </main>
                    </div>

                    {/* مودال (پاپ‌آپ) نمایش جزییات پروژه */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-300" onClick={() => setSelectedProject(null)}>
                            <div className="bg-[#1e1e1e] border border-gray-800 w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl relative animate-in zoom-in-95 duration-300 flex flex-col max-h-[90vh]" onClick={(e) => e.stopPropagation()}>
                                <button 
                                    onClick={() => setSelectedProject(null)}
                                    className="absolute top-4 left-4 z-20 w-9 h-9 rounded-full bg-black/60 hover:bg-black text-white flex items-center justify-center transition-colors border border-gray-700"
                                >
                                    <X className="w-5 h-5" />
                                </button>

                                <div className="w-full aspect-video bg-black relative flex items-center justify-center overflow-hidden shrink-0">
                                    {selectedProject.type === 'video' ? (
                                        <video src={selectedProject.videoUrl} controls autoPlay className="w-full h-full object-contain" />
                                    ) : (
                                        <img src={selectedProject.thumbnail} alt={selectedProject.title[language]} className="w-full h-full object-cover" />
                                    )}
                                </div>

                                <div className="p-6 overflow-y-auto">
                                    <span className="text-[10px] font-bold text-[#121212] bg-[#FF6B00] px-2 py-0.5 rounded-md mb-2 inline-block">
                                        {currentFilters[selectedProject.category]}
                                    </span>
                                    <h3 className="text-white font-black text-lg sm:text-xl mb-3">{selectedProject.title[language]}</h3>
                                    <p className="text-gray-300 text-sm leading-relaxed">{selectedProject.desc[language]}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
