<!DOCTYPE html>
<html lang="fa" dir="rtl" class="overflow-y-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پورتفولیو | محمدمهدی جهانگیری مهر</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* معرفی فونت مدام به مرورگر (فایل‌ها باید در کنار این فایل HTML باشند) */
        @font-face {
            font-family: 'Modam';
            src: url('./Modam.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Modam';
            src: url('./Modam-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Modam';
            src: url('./Modam-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        /* فونت گوگل (Inter) برای بخش انگلیسی */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        html, body {
            overflow-y: scroll !important;
            background-color: #fafafa;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fafafa;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
            border: 2px solid #fafafa;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Icon Components mapping from Lucide
        const Mail = () => <i data-lucide="mail" className="w-4 h-4"></i>;
        const Phone = () => <i data-lucide="phone" className="w-3.5 h-3.5"></i>;
        const ChevronLeft = ({ className }) => <i data-lucide="chevron-left" className={className}></i>;
        const Play = () => <i data-lucide="play" className="w-12 h-12 text-white ml-1"></i>;
        const X = () => <i data-lucide="x" className="w-6 h-6 text-gray-500"></i>;

        function Portfolio() {
            const [activeTab, setActiveTab] = useState('about');
            const [activeFilter, setActiveFilter] = useState('all');
            const [showPhone, setShowPhone] = useState(false);
            const [boxHeight, setBoxHeight] = useState('auto');
            const [language, setLanguage] = useState('fa');
            
            // استیت‌های مربوط به مودال پروژه‌ها
            const [selectedProject, setSelectedProject] = useState(null);
            const [isClosing, setIsClosing] = useState(false);
            
            const contentRef = useRef(null);

            // اجرای آیکون‌های Lucide
            useEffect(() => {
                lucide.createIcons();
            });

            const content = {
                fa: {
                    profile: {
                        name: "محمدمهدی جهانگیری مهر",
                        title: "طراح گرافیک و موشن گرافیک"
                    },
                    ui: {
                        contact: "ارتباط با من",
                        phoneText: "۰۹۱۲ ۳۴۵ ۶۷۸۹", // شماره تلفن خود را جایگزین کنید
                    },
                    tabs: {
                        about: "درباره من",
                        experience: "سوابق کاری",
                        portfolio: "نمونه‌کارها",
                        education: "آموزش‌ها و دوره‌ها",
                        skills: "مهارت‌ها"
                    },
                    filters: {
                        all: "همه",
                        graphic: "طراحی گرافیک",
                        motion: "موشن گرافیک",
                        logo: "طراحی لوگو"
                    }
                },
                en: {
                    profile: {
                        name: "mm.jahangirimehr",
                        title: "Graphic & Motion Designer"
                    },
                    ui: {
                        contact: "Contact Me",
                        phoneText: "+98 912 345 6789", // شماره تلفن خود را جایگزین کنید
                    },
                    tabs: {
                        about: "About Me",
                        experience: "Experience",
                        portfolio: "Portfolio",
                        education: "Education",
                        skills: "Skills"
                    },
                    filters: {
                        all: "All",
                        graphic: "Graphic Design",
                        motion: "Motion Graphics",
                        logo: "Logo Design"
                    }
                }
            };

            const currentContent = content[language];
            const currentUI = currentContent.ui;
            const currentTabs = currentContent.tabs;
            const currentFilters = currentContent.filters;

            const titleWidths = {
                fa: {
                    about: '110px', experience: '120px', portfolio: '110px',
                    'portfolio-all': '140px', 'portfolio-graphic': '150px',
                    'portfolio-motion': '150px', 'portfolio-logo': '140px',
                    education: '160px', skills: '100px'
                },
                en: {
                    about: '115px', experience: '115px', portfolio: '100px',
                    'portfolio-all': '130px', 'portfolio-graphic': '160px',
                    'portfolio-motion': '170px', 'portfolio-logo': '140px',
                    education: '110px', skills: '80px'
                }
            };

            let currentTitleKey = activeTab;
            let displayTitle = currentTabs[activeTab];
            if (activeTab === 'portfolio') {
                currentTitleKey = `portfolio-${activeFilter}`;
                if (activeFilter !== 'all') {
                    displayTitle = `${currentTabs.portfolio} / ${currentFilters[activeFilter]}`;
                }
            }

            useEffect(() => {
                const el = contentRef.current;
                if (!el) return;
                const observer = new ResizeObserver(() => {
                    setBoxHeight(`${el.offsetHeight}px`);
                });
                observer.observe(el);
                setBoxHeight(`${el.offsetHeight}px`);
                return () => observer.disconnect();
            }, [activeTab, activeFilter, language]);

            const closeModal = () => {
                setIsClosing(true);
                setTimeout(() => {
                    setSelectedProject(null);
                    setIsClosing(false);
                }, 300);
            };

            const portfolioItems = [
                { 
                    id: 1, 
                    category: 'motion', 
                    type: 'video',
                    title: { fa: "تیزر تبلیغاتی محصول", en: "Product Promo Video" }, 
                    thumbnail: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=600",
                    mediaUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // لینک ویدیوی تستی
                    desc: { fa: "ساخت تیزر تبلیغاتی با استفاده از افتر افکت و سینما فوردی.", en: "Creating promotional teaser using After Effects and Cinema 4D." }
                },
                { 
                    id: 2, 
                    category: 'graphic', 
                    type: 'image',
                    title: { fa: "طراحی پوستر همایش", en: "Conference Poster Design" }, 
                    thumbnail: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600",
                    mediaUrl: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=1200",
                    desc: { fa: "طراحی پوستر برای همایش بین المللی با ترکیب بندی مدرن.", en: "Poster design for international conference with modern composition." }
                },
                { 
                    id: 3, 
                    category: 'logo', 
                    type: 'image',
                    title: { fa: "لوگوی استارتاپ تکنولوژی", en: "Tech Startup Logo" }, 
                    thumbnail: "https://images.unsplash.com/photo-1526498460520-4c246339dccb?auto=format&fit=crop&q=80&w=600",
                    mediaUrl: "https://images.unsplash.com/photo-1526498460520-4c246339dccb?auto=format&fit=crop&q=80&w=1200",
                    desc: { fa: "طراحی هویت بصری و لوگو مینیمال برای استارتاپ حوزه هوش مصنوعی.", en: "Minimal visual identity and logo design for AI startup." }
                }
            ];

            const experienceItems = [
                { id: 1, role: { fa: "طراح ارشد گرافیک", en: "Senior Graphic Designer" }, company: { fa: "آژانس تبلیغاتی", en: "Ad Agency" }, duration: "1401 - تاکنون", desc: { fa: "طراحی کمپین‌های تبلیغاتی ۳۶۰ درجه برای برندهای معتبر.", en: "Designing 360-degree ad campaigns for top brands." } },
                { id: 2, role: { fa: "موشن دیزاینر", en: "Motion Designer" }, company: { fa: "استودیو خلاق", en: "Creative Studio" }, duration: "1399 - 1401", desc: { fa: "تولید بیش از ۵۰ دقیقه انیمیشن دو بعدی و تیزر تبلیغاتی.", en: "Producing over 50 minutes of 2D animation and promos." } },
            ];

            const filteredPortfolio = activeFilter === 'all' 
                ? portfolioItems 
                : portfolioItems.filter(item => item.category === activeFilter);

            return (
                <div 
                    className="min-h-screen bg-[#fafafa] flex justify-center selection:bg-[#0000fc] selection:text-white transition-colors duration-500"
                    dir={language === 'fa' ? 'rtl' : 'ltr'}
                    style={{ fontFamily: language === 'fa' ? '"Modam", "Inter", sans-serif' : '"Inter", "Modam", sans-serif' }}
                >
                    <div className="w-full max-w-6xl lg:p-8 flex flex-col lg:flex-row gap-0 lg:gap-10 relative items-start">
                        
                        {}
                        <aside className="w-full lg:w-[280px] shrink-0 bg-[#f2f3f5] lg:rounded-2xl flex flex-col lg:sticky lg:top-8 shadow-[0_4px_20px_rgb(0,0,0,0.03)] lg:h-[calc(100vh-4rem)] z-40">
                            
                            {/* ردیف اول: عکس پروفایل و دکمه‌های زبان */}
                            <div className="p-4 lg:p-6 shrink-0 flex flex-row lg:flex-col justify-between lg:justify-start items-center lg:items-stretch gap-4 relative z-20">
                                <div className="flex items-center gap-3 bg-white p-2 lg:p-3 rounded-2xl shadow-sm flex-1 lg:flex-none w-full lg:w-auto">
                                    <div className="w-10 h-10 lg:w-12 lg:h-12 rounded-xl bg-gradient-to-br from-[#0000fc] to-blue-400 overflow-hidden shrink-0 shadow-sm"></div>
                                    <div className="flex flex-col min-w-0">
                                        <h1 className="text-gray-900 font-black text-sm truncate">{currentContent.profile.name}</h1>
                                        <p className="text-gray-500 text-[10px] lg:text-[11px] truncate mt-0.5">{currentContent.profile.title}</p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-1 bg-white p-1 rounded-xl shadow-sm shrink-0">
                                    <button onClick={() => setLanguage('fa')} className={`px-2.5 lg:px-3 py-1.5 lg:py-1 text-[11px] lg:text-xs font-bold rounded-lg transition-colors ${language === 'fa' ? 'bg-[#0000fc] text-white' : 'text-gray-500 hover:bg-gray-50'}`}>فارسی</button>
                                    <button onClick={() => setLanguage('en')} className={`px-2.5 lg:px-3 py-1.5 lg:py-1 text-[11px] lg:text-xs font-bold rounded-lg transition-colors ${language === 'en' ? 'bg-[#0000fc] text-white' : 'text-gray-500 hover:bg-gray-50'}`}>English</button>
                                </div>
                            </div>

                            {}
                            {/* ردیف دوم: منوها (اسکرول افقی در موبایل) */}
                            <div className="flex-none lg:flex-1 overflow-x-auto lg:overflow-y-auto px-4 lg:px-6 pb-2 lg:pb-6 scrollbar-hide relative z-10 w-full">
                                <nav className="flex flex-row lg:flex-col items-start lg:items-stretch gap-1 lg:gap-0 w-max lg:w-full">
                                    {Object.keys(currentTabs).map((key, index) => (
                                        <React.Fragment key={key}>
                                            <div className="flex flex-col items-center lg:items-stretch relative shrink-0">
                                                <button
                                                    onClick={() => {
                                                        setActiveTab(key);
                                                        if (key !== 'portfolio') setActiveFilter('all');
                                                    }}
                                                    className={`relative group px-3 py-2 lg:px-4 lg:py-3 text-[11px] lg:text-sm font-bold rounded-xl transition-all duration-300 whitespace-nowrap shrink-0 w-full ${activeTab === key ? 'text-[#0000fc] bg-white shadow-sm' : 'text-gray-500 hover:text-gray-900 hover:bg-white/50'} ${language === 'en' ? 'lg:text-left text-center' : 'lg:text-right text-center'}`}
                                                >
                                                    <span className="relative z-10">{currentTabs[key]}</span>
                                                </button>

                                                {/* زیرمنوهای نمونه کار (باز شدن عمودی در موبایل) */}
                                                {key === 'portfolio' && (
                                                    <div className={`overflow-hidden transition-all duration-500 ease-in-out flex flex-col items-stretch w-full lg:px-2 ${activeTab === 'portfolio' ? 'max-h-[250px] opacity-100 mt-1 lg:mt-0 lg:my-2' : 'max-h-0 opacity-0 mt-0 m-0'}`}>
                                                        <div className={`flex flex-col gap-1 items-stretch ${language === 'fa' ? 'lg:border-r-2 lg:border-gray-200/60 lg:pr-2 lg:mr-2' : 'lg:border-l-2 lg:border-gray-200/60 lg:pl-2 lg:ml-2'}`}>
                                                            {Object.keys(currentFilters).map((filterKey) => (
                                                                <button
                                                                    key={filterKey}
                                                                    onClick={(e) => { e.stopPropagation(); setActiveFilter(filterKey); }}
                                                                    className={`text-[10px] lg:text-xs font-bold py-1.5 lg:py-2 px-2 lg:px-3 rounded-lg transition-all whitespace-nowrap shrink-0 w-full text-center ${language === 'en' ? 'lg:text-left' : 'lg:text-right'} ${activeFilter === filterKey ? 'text-[#0000fc] bg-blue-50/50' : 'text-gray-400 hover:text-gray-700 hover:bg-gray-100/50'}`}
                                                                >
                                                                    {currentFilters[filterKey]}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* خط جداکننده */}
                                            {index < Object.keys(currentTabs).length - 1 && (
                                                <div className="w-px h-4 lg:w-full lg:h-px bg-gray-200/50 mx-1 lg:mx-0 lg:my-1 shrink-0 mt-2.5 lg:mt-0"></div>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </nav>
                            </div>

                            {}
                            {/* ردیف سوم: دکمه تماس با من */}
                            <div className="hidden lg:block relative shrink-0 pt-4 pb-6 px-6 z-20 mt-auto bg-[#f2f3f5]">
                                <div className="flex flex-col relative w-full items-center">
                                    <button 
                                        onClick={() => setShowPhone(!showPhone)}
                                        className="group relative z-10 flex items-center justify-between w-full h-11 px-4 bg-black text-white text-[13px] font-bold rounded-xl hover:bg-gray-900 transition-all duration-300 shadow-md shadow-black/5"
                                    >
                                        <span>{currentUI.contact}</span>
                                        <ChevronLeft className={`w-4 h-4 transition-transform duration-300 ${showPhone ? '-rotate-90' : (language === 'fa' ? 'rotate-0' : 'rotate-180')}`} />
                                    </button>
                                    
                                    <div className={`w-full overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${showPhone ? 'max-h-16 opacity-100 mt-2' : 'max-h-0 opacity-0 mt-0'}`}>
                                        <div className="bg-white h-11 px-4 rounded-xl flex items-center gap-3 border border-gray-100 shadow-sm w-full">
                                            <div className="w-6 h-6 rounded-md bg-gray-50 flex items-center justify-center text-gray-400 shrink-0"><Phone /></div>
                                            <a href="tel:+989123456789" className="text-gray-900 font-bold tracking-widest text-[13px] hover:text-[#0000fc] transition-colors mt-0.5" dir="ltr">
                                                {currentUI.phoneText}
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {}
                        <main className="flex-1 w-full relative min-w-0 px-4 pb-12 lg:px-0 mt-4 lg:mt-0">
                            
                            {/* ماسک گرادیانت و باکس عنوان */}
                            <div className="sticky top-0 z-30 pt-0 bg-[#fafafa]">
                                <div className="pt-2 lg:pt-4 bg-[#fafafa]">
                                    <div 
                                        className={`h-11 bg-[#0000fc] rounded-xl flex items-center px-4 overflow-hidden transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] ${language === 'fa' ? 'origin-right' : 'origin-left'}`}
                                        style={{ width: titleWidths[language][currentTitleKey] || '200px' }}
                                    >
                                        <h2 key={currentTitleKey} className="text-white font-black text-xs sm:text-sm whitespace-nowrap" style={{ animation: 'fadeIn 0.5s ease-out, zoomIn 0.5s ease-out' }}>
                                            {displayTitle}
                                        </h2>
                                    </div>
                                </div>
                                <div className="h-6 bg-gradient-to-b from-[#fafafa] to-transparent pointer-events-none"></div>
                            </div>

                            {/* محتوای متغیر */}
                            <div className="bg-[#f2f3f5] rounded-2xl w-full overflow-hidden transition-[height] duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] relative" style={{ height: boxHeight }}>
                                <div ref={contentRef} className="p-6 sm:p-8 absolute top-0 left-0 right-0 w-full">
                                    
                                    {activeTab === 'about' && (
                                        <div style={{ animation: 'slideUp 0.7s ease-out, fadeIn 0.7s ease-out' }}>
                                            <h3 className="text-xl font-black text-gray-900 mb-4">{currentTabs.about}</h3>
                                            <div className="prose prose-gray max-w-none text-gray-600 leading-relaxed text-sm sm:text-base">
                                                <p>متن آزمایشی درباره من...</p>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'experience' && (
                                        <div style={{ animation: 'slideUp 0.7s ease-out, fadeIn 0.7s ease-out' }}>
                                            <div className="flex flex-col gap-8 relative before:content-[''] before:absolute before:top-2 before:bottom-2 before:w-px before:bg-gray-200 before:-mx-4 sm:before:-mx-6">
                                                {experienceItems.map((item) => (
                                                    <div key={item.id} className="relative z-10">
                                                        <div className={`absolute top-2 w-2 h-2 rounded-full bg-[#0000fc] ring-4 ring-[#f2f3f5] -mx-[19.5px] sm:-mx-[27.5px] ${language === 'fa' ? 'right-0' : 'left-0'}`}></div>
                                                        <div className="flex flex-col sm:flex-row sm:items-baseline justify-between gap-1 sm:gap-4 mb-2">
                                                            <h4 className="text-gray-900 font-bold text-base">{item.role[language]}</h4>
                                                            <span className="text-gray-400 text-xs font-medium shrink-0 bg-white px-2 py-1 rounded-md border border-gray-100">{item.duration}</span>
                                                        </div>
                                                        <h5 className="text-[#0000fc] text-sm font-bold mb-3">{item.company[language]}</h5>
                                                        <p className="text-gray-500 text-sm leading-relaxed">{item.desc[language]}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {}
                                    {activeTab === 'portfolio' && (
                                        <div key={`portfolio-${activeFilter}`} style={{ animation: 'slideUp 0.7s ease-out, fadeIn 0.7s ease-out' }} className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                                            {filteredPortfolio.map((item) => (
                                                <div 
                                                    key={item.id} 
                                                    onClick={() => setSelectedProject(item)}
                                                    className="group relative rounded-2xl overflow-hidden bg-white shadow-sm border border-gray-100 hover:shadow-md transition-all cursor-pointer"
                                                >
                                                    <div className="aspect-[4/3] w-full overflow-hidden relative bg-gray-900">
                                                        <img src={item.thumbnail} alt={item.title[language]} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out opacity-90 group-hover:opacity-100" />
                                                        
                                                        {item.type === 'video' && (
                                                            <div className="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/10 transition-colors">
                                                                <div className="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 group-hover:scale-110 transition-transform">
                                                                    <Play />
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="p-4 sm:p-5">
                                                        <span className="text-[10px] sm:text-xs font-bold text-[#0000fc] bg-blue-50 px-2 py-1 rounded-md mb-2 inline-block">
                                                            {currentFilters[item.category]}
                                                        </span>
                                                        <h4 className="text-gray-900 font-bold text-sm sm:text-base group-hover:text-[#0000fc] transition-colors">{item.title[language]}</h4>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {activeTab === 'education' && (
                                        <div style={{ animation: 'slideUp 0.7s ease-out, fadeIn 0.7s ease-out' }}>
                                            <p className="text-gray-600">{language === 'fa' ? 'بخش آموزش‌ها...' : 'Education section...'}</p>
                                        </div>
                                    )}

                                    {activeTab === 'skills' && (
                                        <div style={{ animation: 'slideUp 0.7s ease-out, fadeIn 0.7s ease-out' }}>
                                            <p className="text-gray-600">{language === 'fa' ? 'بخش مهارت‌ها...' : 'Skills section...'}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>
                        
                        {}
                        {/* مودال نمایش پروژه */}
                        {selectedProject && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 md:p-12">
                                <div 
                                    className="absolute inset-0 bg-black/60 backdrop-blur-sm" 
                                    onClick={closeModal}
                                    style={{ animation: isClosing ? 'fadeOut 0.3s forwards' : 'fadeIn 0.3s ease-out' }}
                                ></div>
                                
                                <div 
                                    className="bg-white w-full max-w-5xl max-h-[90vh] rounded-2xl sm:rounded-3xl shadow-2xl relative z-10 flex flex-col overflow-hidden"
                                    style={{ animation: isClosing ? 'slideDownOut 0.3s forwards, fadeOut 0.3s forwards' : 'slideUp 0.5s ease-out, zoomIn 0.5s ease-out' }}
                                >
                                    <div className="flex items-center justify-between p-4 sm:p-5 border-b border-gray-100 shrink-0">
                                        <div className="flex flex-col">
                                            <h3 className="font-black text-gray-900 text-lg sm:text-xl">{selectedProject.title[language]}</h3>
                                            <span className="text-[#0000fc] text-xs font-bold mt-1">{currentFilters[selectedProject.category]}</span>
                                        </div>
                                        <button onClick={closeModal} className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center hover:bg-gray-100 transition-colors shrink-0">
                                            <X />
                                        </button>
                                    </div>
                                    
                                    <div className="flex-1 overflow-y-auto bg-gray-50 p-4 sm:p-6 flex flex-col items-center">
                                        {selectedProject.type === 'video' ? (
                                            <div className="w-full rounded-xl overflow-hidden shadow-sm bg-black aspect-video max-w-4xl">
                                                <video controls autoPlay className="w-full h-full object-contain">
                                                    <source src={selectedProject.mediaUrl} type="video/mp4" />
                                                    Your browser does not support the video tag.
                                                </video>
                                            </div>
                                        ) : (
                                            <div className="w-full rounded-xl overflow-hidden shadow-sm max-w-4xl">
                                                <img src={selectedProject.mediaUrl} alt={selectedProject.title[language]} className="w-full h-auto object-contain" />
                                            </div>
                                        )}
                                        
                                        <div className="w-full max-w-4xl mt-6 sm:mt-8 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                            <h4 className="font-bold text-gray-900 mb-2">{language === 'fa' ? 'درباره این پروژه' : 'About this project'}</h4>
                                            <p className="text-gray-600 leading-relaxed text-sm sm:text-base">{selectedProject.desc[language]}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        <style>
                            {`
                            /* اجبار مرورگرهای موبایل به استفاده از فونت صحیح روی دکمه‌ها و فرم‌ها */
                            body, button, input, select, textarea {
                                font-family: ${language === 'fa' ? '"Modam", "Inter", sans-serif' : '"Inter", "Modam", sans-serif'} !important;
                            }

                            @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
                            @keyframes slideDownOut { from { transform: translateY(0); } to { transform: translateY(20px); } }
                            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
                            @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
                            @keyframes zoomIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
                            `}
                        </style>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
