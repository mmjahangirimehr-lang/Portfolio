<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتفولیو | Portfolio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#121212',
                        'card-bg': '#1e1e1e',
                        'cream': '#F2EFE7',
                        'border-grey': '#282828',
                        'text-grey': '#b3b3b3',
                    },
                    fontFamily: {
                        'modam': ['Modam Web', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>

    <style>
        @font-face {
            font-family: 'Modam Web';
            src: url('ModamWeb-VF.woff2') format('woff2');
            font-weight: 100 900;
        }
        body {
            font-family: 'Modam Web', sans-serif;
            background-color: #121212;
            color: #F2EFE7;
            scrollbar-gutter: stable; /* جلوگیری از پرش اسکرول */
        }
        
        /* استایل تگ بیرون زده */
        .outer-tag {
            position: absolute;
            bottom: 20px;
            background-color: #000000;
            color: #F2EFE7;
            padding: 12px 6px;
            font-size: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            border: 1px solid #282828;
            z-index: 10;
        }
        
        [dir="rtl"] .outer-tag {
            right: -20px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        
        [dir="ltr"] .outer-tag {
            left: -20px;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { motion, AnimatePresence } = window.Motion;

        const App = () => {
            const [lang, setLang] = useState('fa');
            const [activeTab, setActiveTab] = useState('portfolio');
            const [selectedProject, setSelectedProject] = useState(null);

            const isFa = lang === 'fa';
            
            const projects = [
                { id: 1, titleFa: 'تیزر تبلیغاتی محصول', titleEn: 'Product Promo Teaser', tagFa: 'موشن گرافیک', tagEn: 'Motion Graphics' },
                { id: 2, titleFa: 'طراحی لوگو شرکتی', titleEn: 'Corporate Logo Design', tagFa: 'طراحی گرافیک', tagEn: 'Graphic Design' },
                { id: 3, titleFa: 'پست شبکه‌های اجتماعی', titleEn: 'Social Media Post', tagFa: 'طراحی گرافیک', tagEn: 'Graphic Design' },
                { id: 4, titleFa: 'انیمیشن معرفی اپلیکیشن', titleEn: 'App Intro Animation', tagFa: 'موشن گرافیک', tagEn: 'Motion Graphics' },
            ];

            return (
                <div className="min-h-screen p-4 md:p-8" dir={isFa ? 'rtl' : 'ltr'}>
                    {/* هدر سایت و دکمه‌های تغییر زبان/تب‌ها */}
                    <header className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
                        <div className="flex gap-2 bg-card-bg p-1 rounded-xl border border-border-grey">
                            <button onClick={() => setLang('fa')} className={`px-4 py-2 rounded-lg text-sm transition-all ${isFa ? 'bg-cream text-black font-bold' : 'text-text-grey'}`}>فارسی</button>
                            <button onClick={() => setLang('en')} className={`px-4 py-2 rounded-lg text-sm transition-all ${!isFa ? 'bg-cream text-black font-bold' : 'text-text-grey'}`}>English</button>
                        </div>
                        
                        <div className="text-center">
                            <h1 className="text-2xl font-bold text-cream mb-1">{isFa ? 'محمدمهدی جهانگیری مهر' : 'M.M. Jahangirimehr'}</h1>
                            <p className="text-text-grey text-sm">{isFa ? 'طراح گرافیک و موشن گرافیک' : 'Graphic & Motion Designer'}</p>
                        </div>
                        
                        <div className="flex gap-4 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                            {['portfolio', 'resume', 'about'].map(tab => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`whitespace-nowrap px-4 py-2 rounded-xl transition-all ${activeTab === tab ? 'bg-cream text-black font-bold' : 'bg-card-bg text-cream border border-border-grey'}`}
                                >
                                    {tab === 'portfolio' ? (isFa ? 'نمونه کارها' : 'Portfolio') : 
                                     tab === 'resume' ? (isFa ? 'سوابق کاری' : 'Resume') : 
                                     (isFa ? 'درباره من' : 'About Me')}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* محتوای تب‌ها */}
                    <main className="max-w-7xl mx-auto">
                        {activeTab === 'portfolio' && (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-x-8 gap-y-12 pr-6 pl-6 md:pr-0 md:pl-0 mt-8">
                                {projects.map((project) => (
                                    <div 
                                        key={project.id} 
                                        className="relative group cursor-pointer"
                                        onClick={() => setSelectedProject(project)}
                                    >
                                        {/* کارت اصلی */}
                                        <div className="bg-card-bg border border-border-grey rounded-3xl p-3 transition-transform hover:scale-[1.02]">
                                            <div className="bg-black rounded-2xl h-40 md:h-48 mb-4 relative flex justify-center items-center overflow-hidden">
                                                <div className="text-border-grey opacity-50 text-xs">Image/Video</div>
                                                {/* آیکون Play */}
                                                <svg className="w-10 h-10 text-cream absolute opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M14.75 12.2a1.5 1.5 0 010 1.6l-5 3.5a1.5 1.5 0 01-2.25-1.2v-7a1.5 1.5 0 012.25-1.2l5 3.5z"></path>
                                                </svg>
                                            </div>
                                            <h3 className="text-lg font-medium text-cream px-1 truncate">
                                                {isFa ? project.titleFa : project.titleEn}
                                            </h3>
                                        </div>
                                        
                                        {/* تگ بیرون زده (طراحی جدید) */}
                                        <div className="outer-tag">
                                            {isFa ? project.tagFa : project.tagEn}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {/* سایر تب‌ها ... (برای خلاصه شدن، فقط پورتفولیو را کامل نوشتم) */}
                        {activeTab !== 'portfolio' && (
                            <div className="text-center text-text-grey py-20 border border-border-grey rounded-3xl border-dashed">
                                {isFa ? 'محتوای این بخش در حال تکمیل است...' : 'Content is being updated...'}
                            </div>
                        )}
                    </main>

                    {/* پاپ‌آپ موشن‌دار (Framer Motion) */}
                    <AnimatePresence>
                        {selectedProject && (
                            <motion.div 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"
                                onClick={() => setSelectedProject(null)}
                            >
                                <motion.div 
                                    initial={{ scale: 0.8, opacity: 0, y: 50 }}
                                    animate={{ scale: 1, opacity: 1, y: 0 }}
                                    exit={{ scale: 0.8, opacity: 0, y: 50 }}
                                    transition={{ type: "spring", damping: 25, stiffness: 300 }}
                                    className="bg-card-bg border border-border-grey p-4 rounded-3xl w-full max-w-4xl"
                                    onClick={e => e.stopPropagation()}
                                >
                                    <div className="bg-black w-full aspect-video rounded-2xl flex items-center justify-center mb-6">
                                        <span className="text-border-grey">Video Player Space</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-2xl font-bold text-cream">{isFa ? selectedProject.titleFa : selectedProject.titleEn}</h2>
                                        <button onClick={() => setSelectedProject(null)} className="text-cream bg-border-grey px-6 py-2 rounded-xl text-sm">
                                            {isFa ? 'بستن' : 'Close'}
                                        </button>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
